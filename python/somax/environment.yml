name: soracle2.7

channels:
  - conda-forge

dependencies:
  - python=3.9

  # compiled scientific stack (conda only)
  - numpy=1.21
  - scipy=1.8
  - numba=0.55.1
  - llvmlite=0.38.1
  - librosa=0.9.2
  - pysoundfile
  - pandas
  - scikit-learn

  - pip

  # pure python only
  - pip:
      - mido
      - python-osc
      - maxosc
      - soxr
      - audioread
