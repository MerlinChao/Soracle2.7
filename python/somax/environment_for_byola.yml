name: soracle2.7

channels:
  - conda-forge

dependencies:
  - python=3.9

  # compiled scientific stack
  - numpy=1.21
  - scipy=1.8
  - numba=0.55.1
  - llvmlite=0.38.1
  - librosa=0.9.2
  - pysoundfile
  - pandas
  - scikit-learn

  # Compatible PyTorch for numpy 1.21
  - pytorch=1.13
  - torchaudio=0.13
  - torchvision=0.14

  - pip

  - pip:
      - pytorch_lightning==1.9.0
      - fire
      - easydict
      - tqdm
      - mido
      - python-osc
      - maxosc
      - soxr
      - audioread